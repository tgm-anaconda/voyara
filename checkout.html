<style>
/* Kein Aufblitzen der Seite vor dem Studienbildschirm.
   ------------------------------------------------------------------
   Die Studienblaetter entstehen erst, wenn alle Skripte geladen sind -
   bis dahin stand die fertige Seite kurz sichtbar da. Der Inhalt bleibt
   deshalb verborgen, bis der Kern entschieden hat, ob ein Blatt
   darueberliegt. Der Notausstieg unten loest die Sperre auf jeden Fall
   nach anderthalb Sekunden: Lieber ein kurzes Blitzen als eine Seite,
   die nach einem Skriptfehler leer bleibt. */
html.studie-wartet .app-shell { visibility: hidden; }
</style>
<script>
document.documentElement.classList.add("studie-wartet");
setTimeout(function () { document.documentElement.classList.remove("studie-wartet"); }, 1500);
</script>
</head>
