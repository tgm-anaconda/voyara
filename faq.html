<title>Häufige Fragen — Voyara</title>
<link rel="stylesheet" href="style.css?v=409" />
<style>
/* Kein Aufblitzen der Seite vor dem Studienbildschirm.
   ------------------------------------------------------------------
   Die Studienblaetter entstehen erst, wenn alle Skripte geladen sind -
   bis dahin stand die fertige Seite kurz sichtbar da. Der Inhalt bleibt
   deshalb verborgen, bis der Kern entschieden hat, ob ein Blatt
   darueberliegt. Der Notausstieg unten loest die Sperre auf jeden Fall
   nach anderthalb Sekunden: Lieber ein kurzes Blitzen als eine Seite,
   die nach einem Skriptfehler leer bleibt. */
html.studie-wartet .app-shell { visibility: hidden; }
/* Arm B der Beobachtbarkeits-Erhebung (25.10.2026).
   ------------------------------------------------------------------
   Dort deckt der Chat die ganze Seite. Der Vorhang oben verbirgt auch
   ihn, bis die Skripte geladen sind - ohne diese Zeile blitzte bei
   jedem Seitenwechsel ein weisser Bildschirm auf und verriete, dass
   gerade navigiert wurde. In der Farbe des Chats faellt der Wechsel
   nicht auf. Die Bedingung steht im sessionStorage und ist damit schon
   vor dem ersten Zeichnen lesbar. */
html.arm-fenster.studie-wartet, html.arm-fenster.studie-wartet body { background: #1c2530; }
</style>
<script>
document.documentElement.classList.add("studie-wartet");
try {
  var g = JSON.parse(sessionStorage.getItem("voyara_agent_gruppe") || "{}");
  if (g && g.zugang === "fenster") document.documentElement.classList.add("arm-fenster");
} catch (e) { /* egal */ }
setTimeout(function () { document.documentElement.classList.remove("studie-wartet"); }, 1500);
</script>
</head>
