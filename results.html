<!DOCTYPE html>

<head>
<meta charset="UTF-8" />

<title>Suchergebnisse — Voyara</title>
<link rel="stylesheet" href="style.css?v=398" />
<style>
/* Kein Aufblitzen der Seite vor dem Studienbildschirm.
   ------------------------------------------------------------------
   Die Studienblaetter entstehen erst, wenn alle Skripte geladen sind -
   bis dahin stand die fertige Seite kurz sichtbar da. Der Inhalt bleibt
   deshalb verborgen, bis der Kern entschieden hat, ob ein Blatt
   darueberliegt. Der Notausstieg unten loest die Sperre auf jeden Fall
   nach anderthalb Sekunden: Lieber ein kurzes Blitzen als eine Seite,
   die nach einem Skriptfehler leer bleibt. */
html.studie-wartet .app-shell { visibility: hidden; }
</style>
<script>
document.documentElement.classList.add("studie-wartet");
setTimeout(function () { document.documentElement.classList.remove("studie-wartet"); }, 1500);
</script>
</head>
<body class="agent-lautlos">
<div class="app-shell">
  <aside class="agent-rail" id="agentRail"></aside>

  <div class="app-main">
    <div id="siteHeader"></div>

    <div class="results-bar">
      <div class="wrap">
        <div class="searchbox" id="searchBox"></div>
      </div>
    </div>

    <div class="wrap">
      <div class="results-layout">
        <!-- Auf dem Handy liegt die Filterspalte sonst vor den Ergebnissen:
             man scrollt an achtzehn Reisezielen und zwoelf Ausstattungs-
             merkmalen vorbei, bevor das erste Haus auftaucht. Deshalb dort
             zugeklappt hinter einem Knopf, am Rechner unveraendert. -->
        <button type="button" class="btn btn-ghost filter-schalter" id="filterSchalter" aria-expanded="false" aria-controls="filterPanel">Filter</button>
        <aside class="filter-panel" id="filterPanel"></aside>
        <main>
          <div class="results-head">
            <div>
              <h1 id="resultsTitle">Ergebnisse</h1>
              <p id="resultsCount"></p>
            </div>
            <div class="sort-wrap">
              <label for="sortSelect">Sortieren:</label>
              <select id="sortSelect"></select>
            </div>
          </div>
          <div id="flightAddon"></div>
          <div class="result-list" id="resultList"></div>
        </main>
      </div>
    </div>

    <div id="siteFooter"></div>
  </div>
</div>
