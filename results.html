<style>
/* Kein Aufblitzen der Seite vor dem Studienbildschirm.
   ------------------------------------------------------------------
   Die Studienblaetter entstehen erst, wenn alle Skripte geladen sind -
   bis dahin stand die fertige Seite kurz sichtbar da. Der Inhalt bleibt
   deshalb verborgen, bis der Kern entschieden hat, ob ein Blatt
   darueberliegt. Solange steht der Ladebildschirm (#ladeschirm).

   Der Notausstieg unten zaehlt erst ab dem Moment, in dem alle Skripte
   durch sind (24.11.2026). Vorher lief er ab dem Anfang der Seite: Bei
   langsamer Verbindung fiel der Vorhang nach anderthalb Sekunden, obwohl
   noch Megabytes fehlten, und man sah sekundenlang ein Geruest ohne Kopf
   und Chat. Nach einem Skriptfehler faellt er weiterhin von selbst. */
html.studie-wartet .app-shell { visibility: hidden; }
/* Arm B der Beobachtbarkeits-Erhebung (25.10.2026).
   ------------------------------------------------------------------
   Dort deckt der Chat die ganze Seite. Der Vorhang oben verbirgt auch
   ihn, bis die Skripte geladen sind - ohne diese Zeile blitzte bei
   jedem Seitenwechsel ein weisser Bildschirm auf und verriete, dass
   gerade navigiert wurde. In der Farbe des Chats faellt der Wechsel
   nicht auf. Die Bedingung steht im sessionStorage und ist damit schon
   vor dem ersten Zeichnen lesbar. */
html.arm-fenster.studie-wartet, html.arm-fenster.studie-wartet body { background: #1c2530; }
</style>
<script>
document.documentElement.classList.add("studie-wartet");
try {
  var g = JSON.parse(sessionStorage.getItem("voyara_agent_gruppe") || "{}");
  /* Dunkler Vorhang nur, wenn der Chat das Bild AUCH deckt (01.11.2026).
     Im Hybrid ist Arm B im Ruhezustand dieselbe Spalte wie Arm A - dort
     waere ein dunkler Ladebildschirm ein sichtbarer Unterschied zwischen
     den Armen, und zwar bei jedem Seitenwechsel. Der Schalter kommt aus
     sperreAn/sperreAus in kern.js. */
  var arbeitet = sessionStorage.getItem("voyara_arbeitet") === "1";
  if (g && (g.zugang === "fensterDauer" || (g.zugang === "fenster" && arbeitet))) {
    document.documentElement.classList.add("arm-fenster");
  }
  /* Arbeitet der Agent, wechselt er selbst die Seiten. Dann kein
     Ladebildschirm, in beiden Armen gleich: Er verriete jeden Wechsel. */
  if (arbeitet) document.documentElement.classList.add("lade-still");
} catch (e) { /* egal */ }
(function () {
  function auf() { document.documentElement.classList.remove("studie-wartet"); }
  document.addEventListener("DOMContentLoaded", function () { setTimeout(auf, 1500); });
  setTimeout(auf, 30000); // haengt eine Datei ganz, bleibt die Seite trotzdem nicht leer
})();
</script>
</head>
<body class="agent-lautlos">
<div id="ladeschirm" role="status" aria-label="Voyara wird geladen"><div class="brand"><span class="brand-mark">V</span><span class="brand-name">Voyara</span></div><div class="lade-balken"><i></i></div></div>

        <!-- Auf dem Handy liegt die Filterspalte sonst vor den Ergebnissen:
             man scrollt an achtzehn Reisezielen und zwoelf Ausstattungs-
             merkmalen vorbei, bevor das erste Haus auftaucht. Deshalb dort
             zugeklappt hinter einem Knopf, am Rechner unveraendert. -->
        <button type="button" class="btn btn-ghost filter-schalter" id="filterSchalter" aria-expanded="false" aria-controls="filterPanel">Filter</button>
        <aside class="filter-panel" id="filterPanel"></aside>
        <main>

            <div>

              <p id="resultsCount"></p>
            </div>
            <div class="sort-wrap">

              <select id="sortSelect"></select>
            </div>
          </div>
          <div id="flightAddon"></div>
          <div class="result-list" id="resultList"></div>
        </main>
      </div>
    </div>

    <div id="siteFooter"></div>
  </div>
</div>
