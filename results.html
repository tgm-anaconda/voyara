<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Suchergebnisse — Voyara</title>
<link rel="stylesheet" href="style.css?v=229" />
</head>
<body class="agent-schublade agent-lautlos">
<div class="app-shell">
  <aside class="agent-rail" id="agentRail"></aside>

  <div class="app-main">
    <div id="siteHeader"></div>

    <div class="results-bar">
      <div class="wrap">
        <div class="searchbox" id="searchBox"></div>
      </div>
    </div>

    <div class="wrap">
      <div class="results-layout">
        <!-- Auf dem Handy liegt die Filterspalte sonst vor den Ergebnissen:
             man scrollt an achtzehn Reisezielen und zwoelf Ausstattungs-
             merkmalen vorbei, bevor das erste Haus auftaucht. Deshalb dort
             zugeklappt hinter einem Knopf, am Rechner unveraendert. -->
        <button type="button" class="btn btn-ghost filter-schalter" id="filterSchalter" aria-expanded="false" aria-controls="filterPanel">Filter</button>
        <aside class="filter-panel" id="filterPanel"></aside>
        <main>
          <div class="results-head">
            <div>
              <h1 id="resultsTitle">Ergebnisse</h1>
              <p id="resultsCount"></p>
            </div>
            <div class="sort-wrap">
              <label for="sortSelect">Sortieren:</label>
              <select id="sortSelect"></select>
            </div>
          </div>
          <div id="flightAddon"></div>
          <div class="result-list" id="resultList"></div>
        </main>
      </div>
    </div>

    <div id="siteFooter"></div>
  </div>
</div>
